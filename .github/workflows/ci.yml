name: 1270NEW

on:
  push:
    paths-ignore:
      - "**/*.md"
      - '**/*.txt'
  pull_request:
    paths-ignore:
      - "**/*.md"
      - '**/*.txt'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.event_name  }}
  cancel-in-progress: true

jobs:
  payload-build:
    name: Payload (KSTUFF_OBS=${{ matrix.kstuff_obs }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kstuff_obs: '0'
            artifact_name: Payload
          - kstuff_obs: '1'
            artifact_name: Payload-observability
    env:
      KSTUFF_OBS: ${{ matrix.kstuff_obs }}
    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install build-essential clang-18 lld-18 xxd yasm nasm

    - name: Install toolchain
      run: |
        wget https://github.com/ps5-payload-dev/pacbrew-repo/releases/latest/download/ps5-payload-dev.tar.gz
        sudo tar xf ps5-payload-dev.tar.gz -C /

    - name: Build Payload
      run: |
        export PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
        bash ci-ps5-kstuff-ldr.sh

    - name: Verify build outputs
      run: |
        test -s ps5-kstuff-ldr/kstuff.elf
        if [ "$KSTUFF_OBS" = 1 ]; then
          test -s ps5-kstuff/debug-reader.elf
          test -s ps5-kstuff/debug-reader.bin
        fi

    - name: Upload Payload
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ./ps5-kstuff-ldr/kstuff.elf
        if-no-files-found: error

    - name: Upload debug reader
      if: matrix.kstuff_obs == '1'
      uses: actions/upload-artifact@v4
      with:
        name: Debug-reader-observability
        path: |
          ./ps5-kstuff/debug-reader.elf
          ./ps5-kstuff/debug-reader.bin
        if-no-files-found: error
